# MC Panel for ZimaOS / CasaOS: App Store > "Instalación personalizada" > Importar > Docker Compose.
# The panel comes ready-made in the image; only your data lives on the disk (/DATA/AppData/mcpanel/data).
# To update: in ZimaOS, "Actualizar" the app (pulls the newest image). Servers and settings are kept.
name: mcpanel
services:
  mcpanel:
    image: ghcr.io/leonardorrc/mcpanel:latest
    container_name: mcpanel
    # Host networking: the panel and every Minecraft port are reachable directly on the ZimaOS IP.
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PANEL_PORT: "8090"
      PANEL_NAME: MC Panel
      PHP_CLI_SERVER_WORKERS: "8"
      TZ: America/Lima
    volumes:
      - type: bind
        source: /DATA/AppData/mcpanel/data
        target: /data
x-casaos:
  main: mcpanel
  architectures:
    - amd64
    - arm64
  author: self
  category: Gaming
  description:
    en_us: Minecraft server panel with console, file manager, startup editor and playit.gg tunnels.
  developer: self
  icon: https://cdn.jsdelivr.net/gh/LeonardoRRC/mcpanel-zimaos@main/docs/brand/png/mcpanel-app-icon-512.png
  index: /
  port_map: "8090"
  scheme: http
  title:
    custom: MC Panel
    en_us: MC Panel
